<div class="xlvo-free-text-list">
	<div class="xlvo-bar-stats">
		<span class="xlvo-bar-stat-badge">{TOTAL_ANSWERS}</span>
		<span class="xlvo-bar-stat-badge xlvo-bar-stat-badge-alt">{TOTAL_PARTICIPANTS}</span>
	</div>
	<div class="xlvo-free-text-list-area">
		<!-- BEGIN empty -->
		<div class="xlvo-free-text-empty">
			<svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M8 10h8M8 14h4m-8 7l3-3h11a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12z"></path></svg>
			<span>{EMPTY_TEXT}</span>
		</div>
		<!-- END empty -->
		<ul class="xlvo-free-text-answers">
			<!-- BEGIN answer -->
			<li class="xlvo-free-text-answer xlvo-free-text-accent-{ACCENT}">{ANSWER}</li>
			<!-- END answer -->
		</ul>
	</div>
</div>
