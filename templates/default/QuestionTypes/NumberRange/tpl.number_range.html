<script src="./Customizing/global/plugins/Services/Repository/RepositoryObject/LiveVoting/templates/js/QuestionTypes/NumberRange/xlvoNumberRange.js?v=2"></script>
<div class="xlvo-number-range">
	<p class="xlvo-voter-type-hint">{VOTER_HINT}</p>
	<form id="{FORM_ID}" class="xlvo-number-range-form" action="{ACTION}" method="post">
		<div class="xlvo-number-range-panel">
			<div class="well xlvo-number-range-value">
				<p id="number-display" class="h1 text-center">{SLIDER_VALUE}</p>
			</div>

			<div class="xlvo-number-range-steppers">
				<button type="button" id="btn-slider-left" class="btn btn-default" aria-label="Decrease value"><i class="glyphicon glyphicon-minus"></i></button>
				<button type="button" id="btn-slider-right" class="btn btn-default" aria-label="Increase value"><i class="glyphicon glyphicon-plus"></i></button>
			</div>

			<div class="xlvo-number-range-slider">
				<input
						id="slider"
						name="user_selected_number"
						data-slider-id="ext1-slider"
						data-provide="slider"
						type="text"
						data-slider-min="{SLIDER_MIN}"
						data-slider-max="{SLIDER_MAX}"
						data-slider-step="{SLIDER_STEP}"
						data-slider-value="{SLIDER_VALUE}"
				/>
				<div class="xlvo-number-range-bounds">
					<span>{SLIDER_MIN}</span>
					<span>{SLIDER_MAX}</span>
				</div>
			</div>
		</div>

		<!-- BEGIN clear -->
		<input type="submit" class="btn btn-default" name="cmd[clear]" value="{BTN_CLEAR}" {BTN_RESET_DISABLED} />
		<!-- END clear -->
		<input type="submit" class="btn btn-default" name="cmd[submit]" value="{BTN_SAVE}" />
		<input id="percentage" name="percentage" type="hidden" value="{SHOW_PERCENTAGE}" />
	</form>
</div>
