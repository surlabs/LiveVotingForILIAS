<div class="xlvo-number-range-results">
	<div class="xlvo-bar-stats">
		<span class="xlvo-bar-stat-badge xlvo-bar-stat-badge-alt">{PARTICIPANTS}</span>
		<span class="xlvo-bar-stat-badge">{MEAN}</span>
		<span class="xlvo-bar-stat-badge">{MEDIAN}</span>
	</div>
	<div class="xlvo-histogram" role="img" aria-label="{AXIS_CAPTION}">
		<!-- BEGIN bin -->
		<div class="xlvo-hist-col">
			<div class="xlvo-hist-plot">
				<div class="xlvo-hist-bar{EMPTY_CLASS}" style="height: {HEIGHT}%;">
					<span class="xlvo-hist-count">{COUNT}</span>
				</div>
			</div>
			<div class="xlvo-hist-label">{LABEL}</div>
		</div>
		<!-- END bin -->
	</div>
	<div class="xlvo-hist-caption">{AXIS_CAPTION}</div>
</div>
