<form class="xlvo-choice-form xlvo-answer-form{LOCKED_CLASS}" action="{ACTION}" method="post" novalidate data-xlvo-clear-on-change="1" data-xlvo-submit-text="{SUBMIT_TEXT}" data-xlvo-require-selection="1">
	<input type="hidden" name="xlvo_selection" value="1">
	<p class="xlvo-voter-type-hint">{VOTER_HINT}</p>
	<div class="xlvo-option-cards">
		<!-- BEGIN option -->
		<label class="xlvo-option-card{SUBMITTED_CLASS}">
			<input type="{TYPE}" name="option_ids[]" value="{OPTION_ID}" {CHECKED} {DISABLED}>
			<span class="xlvo-option-indicator xlvo-option-indicator-{TYPE}" aria-hidden="true"></span>
			<span class="xlvo-option-card-letter">{OPTION_LETTER}</span>
			<span class="xlvo-option-card-text">{TITLE}</span>
		</label>
		<!-- END option -->
	</div>
	<p class="xlvo-answer-feedback" role="alert" hidden>{FEEDBACK}</p>
	<div class="xlvo-answer-buttons">
		<button type="submit" name="cmd[submit]" value="submit" class="xlvo-submit-btn" {SUBMIT_DISABLED}>{SUBMIT_LABEL}</button>
		<button type="button" class="xlvo-change-answer-btn" {CHANGE_DISABLED}>{CHANGE_TEXT}</button>
	</div>
</form>
