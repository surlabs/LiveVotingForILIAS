<div id="display-player" class="panel panel-primary xlvo-new-ui xlvo-start-screen xlvo-challenge-start">
	<div class="panel-body row">
		<div class="col-md-6 xlvo-start-info">
			<div class="xlvo_shortlink well text-center xlvo-start-pin"><h3>{PIN}</h3></div>
			<div class="xlvo_shortlink well text-center"><h3>{SHORTLINK}</h3></div>
			<div class="xlvo_shortlink well text-center"><h3 id="xlvo-attendees">{ONLINE_TEXT}</h3></div>
		</div>
		<div class="col-md-6 xlvo-start-qr-col">
			<div class="xlvo_cm_qr well text-center">
				<button type="button" class="xlvo-start-qr" modal-signal="{MODAL_SIGNAL}" title="{ZOOM_TEXT}">
					<img src="{QR-CODE}" alt="">
				</button>
				<button type="button" class="xlvo-start-zoom" modal-signal="{MODAL_SIGNAL}">
					<span class="glyphicon glyphicon-zoom-in" aria-hidden="true"></span> {ZOOM_TEXT}
				</button>
			</div>
			{MODAL}
		</div>
	</div>
	<div id="xlvo-nickname-list" class="panel-body row">
	</div>
</div>
